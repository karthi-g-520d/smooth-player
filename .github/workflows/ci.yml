# Sanity gate for pull requests into main: unit tests, lint, and a debug build must all pass.
# Branch protection on main should require this workflow's job before a PR can be merged.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Cancel a superseded run when new commits land on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    name: Unit tests, lint, debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew's executable bit isn't tracked in git (lost on a Windows checkout), so set it
      # explicitly rather than relying on the file mode stored in the repo.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The short commit the build came from (a PR's head, not GitHub's merge commit). The player's overlay shows it and
      # the APK artifact is named after it, so a phone test can tell which build it ran.
      - name: Name the build
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "BUILD_ID=${SHA::7}" >> "$GITHUB_ENV"

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      # Lets a debug build be installed straight from the phone when no PC is at hand.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-${{ env.BUILD_ID }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7
